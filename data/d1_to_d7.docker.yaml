# Docker-specific dataset config for local GPU training.
# Expects the repository mounted at /workspace in the container.
path: /workspace/data/darts
train: [images/d1/train, images/d2/train, images/d3_sharpened/train, images/d4_sharpened/train, images/d6_resized/completed/train, images/d7_resized/completed/train]
val: [images/d1/val, images/d2/val, images/d3_sharpened/val, images/d4_sharpened/val, images/d5/val]
test: [images/d1/test, images/d2/test, images/d3_sharpened/test, images/d4_sharpened/test, images/d5/test, images/d6_resized/completed/test, images/d7_resized/completed/test]

nc: 7
names:
  0: 20
  1: 3
  2: 11
  3: 6
  4: dart
  5: 9
  6: 15
